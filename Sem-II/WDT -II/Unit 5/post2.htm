<html>
<head>
<title>HTML LOGIN FORM</title>
<script src="jquery_3.6.min.js">
</script>

</head>
<body>
<p id="p1"></p>
<p id="p2"></p>
<button>Click Here</button>
<script>
$(document).ready(function(){
	$("button").click(function(){
	$("#p1").css({"background":"black","color":"White","font-family":"Ink free","font-weight":"1000"})
		$.post("demo.json",function(data,status) {
		document.getElementById("p1").innerHTML = ("Name is : "+data.name+"<br> Age is : "+data.age+"<br> Gender is : "+data.gender)
		document.getElementById("p2").innerHTML = "Status: " + status;;
		});
		});
		});
</script>
</body>
</html>
