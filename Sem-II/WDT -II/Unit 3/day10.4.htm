<html>
<head>
<title>Day 10.3</title>
</head>
<body style="font-family:Pristina">
<script>
//-----------------------------------------------------//
function storecookie()
{
if (document.myform.email.value=="")
{
alert("Please Enter Email!!");
}
cookievalue = escape(document.myform.email.value);
cookievalue1 = escape(document.myform.pass.value);
document.cookie = "E-MAIL:" + cookievalue + cookievalue1;
document.write("Setting Cookies: "+ "E-Mail: " + cookievalue +"Password: "+ cookievalue1);
}
function readcookie()
{
var allcookies = document.cookie;
cookiearray = allcookies.split(';');
for (i=0;i<cookiearray.length;i++)
{
name = cookiearray[0].split('=')[i];
value = cookiearray[1].split('=')[i];
document.getElementById("txtarea").value=("Key is:"+name+"and Value is :"+value);
}
}
//-----------------------------------------------------//
</script>

<form name="myform">
Email:<input type="text" name="email"/>
Password:<input type="password" name="pass"/>
<input type="checkbox" value="save" name="save"/>Save
<input type="button" value="store" onclick="storecookie();"/>
<br><br>
<input type="button" value="Get All" onclick="readcookie();"/>
<textarea rows="8" cols="20" id="txtarea"></textarea>
</form>

</body>
</html>
