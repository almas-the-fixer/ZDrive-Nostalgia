<body style="font-family:Comic Sans MS;color:black;background-color:olive;">
<script type="text/javascript">
//---------------------------------------------------//
var Car = new Object();
Car.model = new Object();//Creating Nested Object
Car.colour="Blue";
Car.brand="Ford";
Car.model.lettr="A";
Car.model.yr="2023";

document.write("Model Made in "+Car.model.yr);//Accessing Nested Object
document.write("<br>colour is "+Car.colour);
document.write("<br>brand is "+Car.brand);
document.write("<br>Model Type is "+Car.model.lettr);//Accessing Nested Object
//---------------------------------------------------//
</script>

</body>
