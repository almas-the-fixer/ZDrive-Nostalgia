<html>
<head>
<title>Day 9.8</title>
</head>
<body>
<script>
function bonus()
{
a=parseInt(document.getElementById("salary").value);

if (a>=5000 && a<10000)
{
a=a+(a*10/100);
}
else if (a>=10000 && a<50000)
{
a=a+(a*7.5/100);
}
else if (a>=50000 && a<100000)
{
a=a+(a*5/100)
}
else if (a>=100000)
{
a=a+(a*2.5/100)
}
document.getElementById("ans").value=a;
}
</script>
<form>
Name of Employee:<input type="text" id="name"/>
Salary:<input type="text" id="salary"/>
Final Salary after bonus:<input type="text" id="ans"/>
<input type="button" value="generate" id="gen" onclick="bonus()"/>
</form>
</body>
</html>
