<html>
<head>
<title>Jquery removeClass Method</title>
<style>
.intro
{
color:yellow;
background:black;
font-family:Pristina;
}

</style>
</head>
<body style="background:cornsilk;">
<script src="jquery_3.6.min.js">
</script>
<script>
$(document).ready(function(){
$("button").click(function(){
	$("div").addClass("intro")
	$("#btn").click(function(){
	$("#div1").removeClass("intro")
	});
	});
	});
</script>
</body>
<div id="div1">
<h1>This is a Heading</h1>
<p>This is a Paragraph 1 in div 1</p>
<p>This is a Paragraph 2 in div 1</p>
</div>
<div id="div2">
<p>This is Paragraph 1</p>
<p>This is Paragraph 2</p>
<p>This is Paragraph 3</p>
<p>This is Paragraph 4</p>
</div>
<button>Click Here to add class</button>
<button id="btn">Click Here to remove class</button>
</html>
