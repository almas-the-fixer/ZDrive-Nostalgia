<html>
<head>
<title>Jquery CSS property</title>
<style>
div
{
float:left;
width:30%;
height:30%;
}
div2
{
float:right;
width:30%;
height:30%;
}
div3
{
float:center;
width:30%;
height:30%;
}
</style>
</head>
<body>
<script src="jquery_3.6.min.js">
</script>
<script>
$(document).ready(function(){
$("button").click(function(){
	$("#div1").css("background-color","red")
	});
	$("#btn1").click(function(){
	$("#div2").css("background-color","green")
	});
	$("#btn2").click(function(){
	$("#div3").css("background-color","blue")
	});
	});
</script>
</body>
<div id="div1">
</div>
<div id="div2">
</div>
<div id="div3">
</div>
<button>Click Here to get red division</button>
<button id="btn1">Click Here to get green division</button>
<button id="btn2">Click Here to get Blue division</button>
</html>
