<!DOCTYPE html>
<html>
<head>
<title>DAY-6.1</title>
</head>
<body>
<script type="text/javascript">
//---------------------------------------------------//
function add()
{
no1=parseInt(document.getElementById("no1").value);
no2=parseInt(document.getElementById("no2").value);

add=no1+no2;

document.getElementById("result").value=add;

}
function sub()
{
no1=parseInt(document.getElementById("no1").value);
no2=parseInt(document.getElementById("no2").value);

sub=no1-no2;

document.getElementById("result").value=sub;

}
function mul()
{
no1=parseInt(document.getElementById("no1").value);
no2=parseInt(document.getElementById("no2").value);

mul=no1*no2;

document.getElementById("result").value=mul;

}
function div()
{
no1=parseInt(document.getElementById("no1").value);
no2=parseInt(document.getElementById("no2").value);

div=no1/no2;

document.getElementById("result").value=div;

}
//---------------------------------------------------//
</script>
<form>
No1:-<input type="text" id="no1"/>
No2:-<input type="text" id="no2"/>
<br><input type="button" onclick="add();" value="+"/>  <input type="button" onclick="sub();" value="-"/>  <input type="button" onclick="mul();" value="*"/>  <input type="button" onclick="div();" value="/"/>
<br>Ans:-<input type="text" id="result"/>
</form>
</body>
</html>
