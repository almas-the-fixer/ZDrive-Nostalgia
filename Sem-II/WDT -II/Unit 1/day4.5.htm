<body>
<script>
//---------------------------------------------------//
myarray=new Array();
i=0;
sum=0;
while(i<5)
{
myarray[i]=prompt("Enter array element "+i+" : ");
myarray[i]=Number(myarray[i]);
sum=sum+myarray[i];
i++;
}
document.write("Sum is: "+sum);
//---------------------------------------------------//
</script>
