<!DOCTYPE html>
<html>
<head>
<title>DAY-3.2</title>
</head>
<body>
<script>
//Multiplication table from user
//---------------------------------------------------//
n=prompt("Enter no which multiplication table you want: ");
n=Number(n);
ans=0;
for(i=1;i<=10;i++)
{
ans=n*i;
document.write("<br>"+n+"*"+i+"="+ans);
}
//---------------------------------------------------//
</script>
</body>
</html>
