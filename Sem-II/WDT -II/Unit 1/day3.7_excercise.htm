<!DOCTYPE html>
<html>
<head>
<title>DAY-3.2</title>
</head>
<body>
<script>
//---------------------------------------------------//
sum=0;
for(i=1;i<=100;i++)
{
if(i%3==0)
{
document.write(i+"<br>");
sum=sum+i;
}
}
document.write("Sum of Numbers b/w 100 and divisible by 3 : "+sum);
//---------------------------------------------------//
</script>
</body>
</html>
