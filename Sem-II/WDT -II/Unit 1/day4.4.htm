<!DOCTYPE html>
<html>
<head>
<title>DAY-4.4</title>
</head>
<body>
<script>
//---------------------------------------------------//
myarray=new Array();
l=prompt("Enter length of array: ");
l=Number(l);
for(i=0;i<l;i++)
{
myarray[i]=prompt("Enter Array"+i+"Element: ");
myarray[i]=Number(myarray[i]);
}
sum=0;
for(i=0;i<l;i++)
{
sum=sum+myarray[i];
}
document.write("<br>The Sum is: "+sum);
//---------------------------------------------------//
</script>
</body>
</html>
