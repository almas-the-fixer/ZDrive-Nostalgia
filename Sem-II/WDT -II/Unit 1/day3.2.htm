<!DOCTYPE html>
<html>
<head>
<title>DAY-3.2</title>
</head>
<body>
<script>
//---------------------------------------------------//
a=prompt("Enter a Number: ");
a=Number(a);
if(a>0)
{
document.write("Number is Positive");
}
else if(a<0)
{
document.write("Number is Negative");
}
else if(a==0)
{
document.write("Number is Zero");
}
else
{
document.write("Please Enter a Valid Number!");
}
//---------------------------------------------------//
</script>
</body>
</html>
