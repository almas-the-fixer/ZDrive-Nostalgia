<!DOCTYPE html>
<html>
<head>
<title>DAY-3.2</title>
</head>
<body>
<script>
//---------------------------------------------------//
sum=0;
for(i=1;i<500;i++)
{
if(i%2!=0)
{
document.write(i+"<br>");
}
else
{
sum=sum+i;
}
}
document.write("Sum of even numbers b/w 1 to 500 == "+sum);
//---------------------------------------------------//
</script>
</body>
</html>
