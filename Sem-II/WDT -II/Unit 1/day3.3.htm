<!DOCTYPE html>
<html>
<head>
<title>DAY-3.2</title>
</head>
<body>
<script>
//---------------------------------------------------//
var number=prompt("Enter a Number: ");
if(number%2!=0) //We Can also use if(number%2==0) 
{
document.write("The Number is Odd!"); //Value if true
}
else
{
document.write("The Number is Even!"); //Value if false
}
//---------------------------------------------------//
</script>
</body>
</html>
