<body>
<script>
//---------------------------------------------------//
ans=0;
for(i=1;i<=10;i++)
{
for(j=1;j<=10;j++){
ans=i*j;
document.write("<br>"+i+"*"+j+"="+ans);
}
document.write("<br>");
}
//---------------------------------------------------//
</script>
