<html>
<head>
<title></title>
</head>
<body>
<script>
a=prompt("Enter a number a: ");
b=prompt("Enter a number b: ");
add=Number(a)+Number(b);
sub=Number(a)-Number(b);
mul=Number(a)*Number(b);
div=Number(a)/Number(b);
mod=Number(a)%Number(b);
document.write("<br>Addition of a with b: "+add);
document.write("<br>Subtraction of a with b: "+sub);
document.write("<br>Multiplication of a with b: "+mul);
document.write("<br>Division of a with b: "+div);
document.write("<br>Modulo of a with b: "+mod);
</script>
</body>
</html>
