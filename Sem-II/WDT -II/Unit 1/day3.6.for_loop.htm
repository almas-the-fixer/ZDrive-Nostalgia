<script>
//---------------------------------------------------//
n=prompt("Enter Starting value: ");
m=prompt("Enter Ending value");
n=Number(n);
m=Number(m);
sum=0;
for(i=n;i<=m;i++)
{
sum=sum+i;
}
document.write("Sum = "+sum);
//---------------------------------------------------//
</script>
