<body>
<script>
let a=prompt("Enter Value of a: ");
let b=prompt("Enter Value of b: ");
let min=Number(a)<Number(b) ? "a is minimum":"b is minimum";
let max=Number(a)>Number(b) ? "a is maximum":"b is maximum";
document.write(min);
document.write("<br>"+max);
</script>
</body>
